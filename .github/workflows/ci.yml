name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macOS only for now. Re-add windows-latest and ubuntu-22.04 when we
        # start on those platforms (the native UI will need extra system
        # libraries on Linux; add that step then).
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml, so CI uses the same pinned Rust as local dev.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Known-vulnerability scan of dependencies. Kept as its own job so a new
  # advisory shows up separately from build/test failures.
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Prebuilt cargo-audit binary (much faster than compiling it).
      - uses: taiki-e/install-action@cargo-audit
      # Fails on known vulnerabilities in Cargo.lock; "unmaintained" crates only warn.
      - run: cargo audit
