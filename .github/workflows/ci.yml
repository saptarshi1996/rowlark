name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macOS only for now. Re-add windows-latest and ubuntu-22.04 when we
        # start on those platforms (the Linux deps step below is already wired).
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reads rust-toolchain.toml, so CI uses the same pinned Rust as local dev.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Tauri's Linux system libraries (WebKitGTK etc.).
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
