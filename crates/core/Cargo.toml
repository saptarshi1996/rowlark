[package]
name = "rowlark-core"
version = "0.1.0"
description = "Rowlark core: drivers, Value type, streaming. No Tauri or UI dependencies."
edition = "2024"

[dependencies]
# Needed so `Value` can be turned into JSON for the UI (the IPC boundary).
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Tests only: lets us assert on the exact JSON the UI will receive.
serde_json = "1"
