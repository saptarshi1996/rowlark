[package]
name = "rowlark-core"
version = "0.1.0"
description = "Rowlark core: drivers, Value type, streaming. No UI dependencies."
edition = "2024"

[dependencies]
# Needed so `Value` can be turned into JSON for output and debugging.
serde = { version = "1", features = ["derive"] }
# Typed error enums without hand-writing boilerplate.
thiserror = "2"
# Database access. default-features = false drops the compile-time query macros
# (we run arbitrary user SQL, so we cannot use them) and every database we do
# not support yet. `tls-rustls-ring-native-roots` adds TLS (rustls) and makes it
# trust the operating system's certificate authorities, so verified TLS works
# against public cloud databases without extra files.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring-native-roots"] }
# Async runtime pieces used directly: channels (`mpsc`), an async `Mutex`, and
# `timeout` for connecting.
tokio = { version = "1", features = ["sync", "time"] }
# Reading `postgres://` URLs (both already come with sqlx, so no extra build cost).
url = "2"
percent-encoding = "2"
# Catching the server's notices. sqlx reports them only as `tracing` events, so
# we listen for those (tracing is already in the build through sqlx).
tracing = { version = "0.1", default-features = false, features = ["std"] }
# `StreamExt::next()` for reading rows one by one from sqlx.
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
# Tests only: lets us assert on the exact JSON a Value produces.
serde_json = "1"
# Tests only: `#[tokio::test]`, a multi-threaded runtime, and sleep/timeout.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
