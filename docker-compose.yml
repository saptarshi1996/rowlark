# Test databases for Rowlark's driver and golden tests. Dev-only credentials.
# Start: `docker compose up -d`   Stop: `docker compose down`
# Each server gets its own host port so they can all run at once.
#   Postgres 14-17 -> 54314..54317    Postgres 16 with TLS -> 54326
#   MySQL 8/9 -> 33080/33090    MariaDB -> 33106
# User: rowlark / Password: rowlark / Database: rowlark_test

x-postgres: &postgres
  environment:
    POSTGRES_USER: rowlark
    POSTGRES_PASSWORD: rowlark
    POSTGRES_DB: rowlark_test
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U rowlark -d rowlark_test"]
    interval: 5s
    timeout: 3s
    retries: 20

x-mysql: &mysql
  environment:
    MYSQL_ROOT_PASSWORD: rowlark
    MYSQL_USER: rowlark
    MYSQL_PASSWORD: rowlark
    MYSQL_DATABASE: rowlark_test
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prowlark --silent"]
    interval: 5s
    timeout: 3s
    retries: 30

services:
  postgres14:
    <<: *postgres
    image: postgres:14
    ports: ["54314:5432"]
  postgres15:
    <<: *postgres
    image: postgres:15
    ports: ["54315:5432"]
  postgres16:
    <<: *postgres
    image: postgres:16
    ports: ["54316:5432"]
  postgres17:
    <<: *postgres
    image: postgres:17
    ports: ["54317:5432"]

  # Postgres with TLS switched on, for the TLS tests. Needs test certificates
  # first: run scripts/gen-test-certs.sh before `docker compose up`.
  # Users: "rowlark" (password, TLS optional) and "rowlark_cert" (client
  # certificate only). The server certificate is for the name "localhost".
  # The wrapper copies the certificates somewhere owned by the postgres user,
  # because Postgres refuses a private key with the wrong owner or permissions.
  postgres16tls:
    <<: *postgres
    image: postgres:16
    ports: ["54326:5432"]
    volumes:
      - ./.test-certs:/certs:ro
      - ./docker/tls:/tlsconf:ro
      - ./docker/tls/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - bash
      - -c
      - |
        set -e
        mkdir -p /var/lib/postgresql/tls
        cp /certs/server.crt /certs/server.key /certs/ca.crt /var/lib/postgresql/tls/
        cp /tlsconf/pg_hba.conf /var/lib/postgresql/tls/
        chown -R postgres:postgres /var/lib/postgresql/tls
        chmod 600 /var/lib/postgresql/tls/server.key
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/var/lib/postgresql/tls/server.crt \
          -c ssl_key_file=/var/lib/postgresql/tls/server.key \
          -c ssl_ca_file=/var/lib/postgresql/tls/ca.crt \
          -c hba_file=/var/lib/postgresql/tls/pg_hba.conf

  mysql8:
    <<: *mysql
    image: mysql:8.0
    ports: ["33080:3306"]
  mysql9:
    <<: *mysql
    image: mysql:9
    ports: ["33090:3306"]

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rowlark
      MARIADB_USER: rowlark
      MARIADB_PASSWORD: rowlark
      MARIADB_DATABASE: rowlark_test
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports: ["33106:3306"]
