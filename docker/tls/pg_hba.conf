# Access rules for the TLS test server (see docker-compose.yml, postgres16tls).
# The first matching line wins.
local   all   all                    trust
# "rowlark_cert" may only log in over TLS, with a client certificate.
hostssl all   rowlark_cert  all      cert
# "rowlark" logs in with a password, over TLS or not.
host    all   rowlark       all      scram-sha-256
